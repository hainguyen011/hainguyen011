<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252">
<defs>
<style>
  @keyframes s1 { 0%,32%{opacity:1} 35%,97%{opacity:0} 100%{opacity:1} }
  @keyframes s2 { 0%,33%{opacity:0} 36%,64%{opacity:1} 67%,100%{opacity:0} }
  @keyframes s3 { 0%,66%{opacity:0} 69%,96%{opacity:1} 100%{opacity:0} }
  .g1 { animation: s1 21s ease-in-out infinite; }
  .g2 { animation: s2 21s ease-in-out infinite; }
  .g3 { animation: s3 21s ease-in-out infinite; }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 13px; }
  .sm  { font-size: 11px; }
  .xs  { font-size: 10.5px; }
  /* GitHub-native colours */
  .p  { fill: #58a6ff; }          /* blue — prompt */
  .w  { fill: #e6edf3; }          /* primary text — command */
  .g  { fill: #3fb950; }          /* green — labels */
  .dv { fill: #8b949e; }          /* secondary text — values */
  .r  { fill: #f85149; }          /* red — error/warn */
  .y  { fill: #d29922; }          /* yellow — directories */
  .mu { fill: #484f58; }          /* muted — counter / meta */
</style>
</defs>

<!-- Transparent canvas — NO background rect.
     GitHub page bg shows through on both dark and light mode. -->

<!-- ── Terminal card (GitHub card bg + border) ── -->
<rect x="0" y="0" width="720" height="252" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>

<!-- ── Title bar ── -->
<rect x="0" y="0" width="720" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
<rect x="0" y="20" width="720" height="8" fill="#21262d"/>
<!-- Traffic-light dots -->
<circle cx="22" cy="14" r="5" fill="#ff5f57"/>
<circle cx="40" cy="14" r="5" fill="#febc2e"/>
<circle cx="58" cy="14" r="5" fill="#28c840"/>
<text class="mu sm" x="360" y="18" text-anchor="middle">hainguyen011  —  terminal</text>

<!-- Slide counter -->
<g class="g1"><text class="mu sm" x="708" y="18" text-anchor="end">[ 1 / 3 ]</text></g>
<g class="g2"><text class="mu sm" x="708" y="18" text-anchor="end">[ 2 / 3 ]</text></g>
<g class="g3"><text class="mu sm" x="708" y="18" text-anchor="end">[ 3 / 3 ]</text></g>

<!-- ════════ SLIDE 1 — IDENTITY ════════ -->
<g class="g1">
  <text y="60">
    <tspan x="24" class="p">hainguyen011@i2flabs:~$</tspan>
    <tspan class="w">  whoami --verbose</tspan>
  </text>
  <text y="88"> <tspan x="24" class="g">name      </tspan><tspan x="148" class="w">Hai Nguyen</tspan></text>
