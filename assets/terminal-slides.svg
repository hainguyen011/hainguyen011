    <tspan class="w">  ls -la ./i2flabs/</tspan>
  </text>
  <text y="92"> <tspan x="24" class="y">AEVUM_OS/    </tspan><tspan x="148" class="dv">Autonomous AI Desktop OS  ·  MCP  ·  Spiking LIF Kernel</tspan></text>
  <text y="118"><tspan x="24" class="y">AEVUM_CLOUD/ </tspan><tspan x="148" class="dv">P2P Agent Mesh  ·  Secure Cloud Tunneling  ·  WebSockets</tspan></text>
