  <text class="r xs" y="214"><tspan x="24">[INFO]  All systems nominal. Build sequence: running.</tspan></text>
  <circle cx="650" cy="210" r="5" fill="#30363d"/>
  <circle cx="668" cy="210" r="5" fill="#3fb950"/>
  <circle cx="686" cy="210" r="5" fill="#30363d"/>
</g>

<!-- ════════ SLIDE 3 — STACK ════════ -->
<g class="g3">
  <text y="60">
    <tspan x="24" class="p">hainguyen011@i2flabs:~$</tspan>
    <tspan class="w">  cat /etc/stack.conf</tspan>
  </text>
  <text y="88"> <tspan x="24" class="g">[agentic] </tspan><tspan x="136" class="dv">MCP  ·  Spiking LIF  ·  Qdrant  ·  Neo4j Graph RAG  ·  Gemini</tspan></text>
  <text y="108"><tspan x="24" class="g">[arch]    </tspan><tspan x="136" class="dv">DDD  ·  Event-Driven  ·  Local-First CRDT  ·  Clean  ·  CQRS</tspan></text>
  <text y="128"><tspan x="24" class="g">[backend] </tspan><tspan x="136" class="dv">TypeScript  ·  Node.js  ·  Fastify  ·  Redis  ·  PostgreSQL</tspan></text>
  <text y="148"><tspan x="24" class="g">[client]  </tspan><tspan x="136" class="dv">Electron  ·  React 19  ·  Vite  ·  SCSS Design Tokens</tspan></text>
  <text y="168"><tspan x="24" class="g">[infra]   </tspan><tspan x="136" class="dv">Docker  ·  Kubernetes  ·  Nginx  ·  GitHub Actions</tspan></text>
  <line x1="0" y1="196" x2="720" y2="196" stroke="#30363d" stroke-width="1"/>
  <text class="r xs" y="214"><tspan x="24">[WARN]  Stack growing. Entropy: contained. Architecture: solid.</tspan></text>
  <circle cx="650" cy="210" r="5" fill="#30363d"/>
  <circle cx="668" cy="210" r="5" fill="#30363d"/>
  <circle cx="686" cy="210" r="5" fill="#3fb950"/>
