  <text y="128"><tspan x="24" class="g">building  </tspan><tspan x="148" class="dv">Autonomous multi-agent intelligence ecosystems</tspan></text>
  <text y="148"><tspan x="24" class="g">principle </tspan><tspan x="148" class="dv">Syntax is disposable. Architecture is forever.</tspan></text>
  <text y="168"><tspan x="24" class="g">obsessed  </tspan><tspan x="148" class="dv">Local-First CRDTs  ·  Spiking LIF  ·  MCP  ·  DDD</tspan></text>
  <line x1="0" y1="196" x2="720" y2="196" stroke="#30363d" stroke-width="1"/>
  <text class="r xs" y="214"><tspan x="24">[ERR 0x00]  Human limitations not found. Continuing...</tspan></text>
  <circle cx="650" cy="210" r="5" fill="#3fb950"/>
  <circle cx="668" cy="210" r="5" fill="#30363d"/>
  <circle cx="686" cy="210" r="5" fill="#30363d"/>
</g>

<!-- ════════ SLIDE 2 — PROJECTS ════════ -->
<g class="g2">
