<!-- Bottom bar -->
<rect x="0" y="238" width="720" height="14" rx="2" fill="#21262d"/>
<rect x="0" y="238" width="720" height="6" fill="#21262d"/>
<text class="mu xs" x="24"  y="248">i2flabs kernel v0.9.1  ·  aevum-os</text>
<text class="mu xs" x="696" y="248" text-anchor="end">auto-slide  7s</text>

</svg>