<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140">
  <defs>
    <style>
      @keyframes rgb-tear {
        0%,89%,100% { opacity: 0; }
        90%  { clip-path: inset(22% 0 61% 0); transform: translate(-5px,0); opacity: 0.7; }
        92%  { clip-path: inset(54% 0 28% 0); transform: translate(5px, 0); opacity: 0.7; }
        94%  { clip-path: inset(8%  0 78% 0); transform: translate(-3px,0); opacity: 0.6; }
        96%  { clip-path: inset(70% 0 10% 0); transform: translate(3px, 0); opacity: 0.7; }
        98%  { clip-path: inset(38% 0 44% 0); transform: translate(-5px,0); opacity: 0.5; }
      }
      @keyframes rgb-tear-b {
        0%,89%,100% { opacity: 0; }
        91%  { clip-path: inset(44% 0 38% 0); transform: translate(5px, 0); opacity: 0.6; }
        93%  { clip-path: inset(15% 0 70% 0); transform: translate(-4px,0); opacity: 0.6; }
        95%  { clip-path: inset(62% 0 20% 0); transform: translate(4px, 0); opacity: 0.6; }
        97%  { clip-path: inset(30% 0 52% 0); transform: translate(-3px,0); opacity: 0.5; }
        99%  { clip-path: inset(78% 0 5%  0); transform: translate(3px, 0); opacity: 0.6; }
      }
      @keyframes flicker {
        0%,91%,100% { opacity:1; }
        92% { opacity:0.6; }
        93% { opacity:1;   }
        94% { opacity:0.3; }
        95% { opacity:1;   }
      }
      .name {
        font-family: 'JetBrains Mono','Courier New',monospace;
        font-size: 48px; font-weight: 800; fill: #f1f5f9;
        animation: flicker 7s infinite;
      }
      .name-r {
        font-family: 'JetBrains Mono','Courier New',monospace;
        font-size: 48px; font-weight: 800; fill: #ff003c;
        animation: rgb-tear 7s infinite;
      }
      .name-b {
        font-family: 'JetBrains Mono','Courier New',monospace;
        font-size: 48px; font-weight: 800; fill: #00e5ff;
        animation: rgb-tear-b 7s infinite 0.05s;
      }
      .sub {
        font-family: 'JetBrains Mono','Courier New',monospace;
        font-size: 12px; fill: #475569; letter-spacing: 4px;
      }
      .accent { stroke: #0284c7; stroke-width: 1; opacity: 0.35; }
    </style>
  </defs>

  <rect width="900" height="140" fill="#000000"/>

  <!-- Accent lines — minimal, intentional -->
  <line class="accent" x1="0" y1="30"  x2="900" y2="30"/>
  <line class="accent" x1="0" y1="111" x2="900" y2="111"/>

  <!-- RGB glitch layers — only fire during the tear animation -->
  <text class="name-r" x="450" y="90" text-anchor="middle">HAI NGUYEN</text>
  <text class="name-b" x="450" y="90" text-anchor="middle">HAI NGUYEN</text>
  <!-- Base -->
  <text class="name"   x="450" y="90" text-anchor="middle">HAI NGUYEN</text>

  <text class="sub" x="450" y="127" text-anchor="middle">SYSTEMS ARCHITECT  /  AI SYSTEMS FOUNDER  @  I2FLABS</text>
</svg>